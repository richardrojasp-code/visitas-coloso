      var nm = IS_LIST[+b.dataset.i], cur = isList(form).slice(), at = cur.indexOf(nm);
      if (at >= 0) cur.splice(at, 1); else cur.push(nm);
      form.is = IS_LIST.filter(function (x) { return cur.indexOf(x) >= 0; });
      saveMsg = null; saveDraft(); var y2 = window.scrollY; render(); window.scrollTo(0, y2);
    }
    else if (a === 'save') save();
    else if (a === 'open') { openVisitId = b.dataset.id; confirmDel = null; tab = 'resultados'; render(); window.scrollTo(0, 0); }
    else if (a === 'close') { openVisitId = null; render(); }
    else if (a === 'edit') { var vv = visitas.filter(function (x) { return x.id === b.dataset.id; })[0]; if (vv) { form = JSON.parse(JSON.stringify(vv)); delete form.id; delete form._owner; editingId = vv.id; editingOwner = vv._owner; saveMsg = null; saveDraft(); tab = 'pauta'; render(); window.scrollTo(0, 0); } }
    else if (a === 'toggleAccion') { toggleAccion(b.dataset.id); }
    else if (a === 'del') { confirmDel = b.dataset.id; render(); }
    else if (a === 'delNo') { confirmDel = null; render(); }
    else if (a === 'delYes') { delVisita(b.dataset.id); }
  });
  var fieldMap = { 'f-fecha': 'fecha', 'f-etapa': 'etapa', 'f-sup': 'supervisor', 'f-eval': 'evaluador', 'f-tarea': 'tarea', 'f-proc': 'procedimiento','f-brecha': 'brecha', 'f-resp': 'accionResp', 'f-afecha': 'accionFecha' };
  app.addEventListener('input', function (e) {
    var el = e.target; if (!form) return;
    if (fieldMap[el.id]) { form[fieldMap[el.id]] = el.value; if (el.id === 'f-fecha') form.turno = turnoDe(el.value); }
    else if (el.dataset.nota != null) form.obsNota[+el.dataset.nota] = el.value;
    else if (el.dataset.evid) form.evid[el.dataset.evid] = el.value;
    saveDraft();
  });
  app.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'f-sup' || el.id === 'f-fecha') { var y = window.scrollY; render(); window.scrollTo(0, y); }

  });

  // ---------- Datos ----------
  // ---------- Datos (Supabase) ----------
  function toRow(d) {
    return { fecha: d.fecha, turno: turnoDe(d.fecha), etapa: d.etapa, supervisor: d.supervisor, evaluador: d.evaluador, tarea: d.tarea, procedimiento: d.procedimiento,
      is_list: isList(d), obs: d.obs, obs_nota: d.obsNota, aud: d.aud, evid: d.evid, brecha: d.brecha, accion_resp: d.accionResp, accion_fecha: d.accionFecha || null,
      accion_estado: d.accionEstado || 'abierta', p_tec: d.pTec, p_seg: d.pSeg, p_tot: d.pTot, p_ubica: d.pUbica };
  }
  function fromRow(r) {
    return { id: r.id, fecha: r.fecha, turno: r.turno, etapa: r.etapa, supervisor: r.supervisor, evaluador: r.evaluador, tarea: r.tarea || '', procedimiento: r.procedimiento || '',
      is: r.is_list || [], obs: r.obs || [], obsNota: r.obs_nota || [], aud: r.aud || {}, evid: r.evid || {}, brecha: r.brecha || '', accionResp: r.accion_resp || '',
      accionFecha: r.accion_fecha || '', accionEstado: r.accion_estado || 'abierta', creado: r.creado };
  }
  function errText(e) { return (e && e.message) ? e.message : 'error desconocido'; }
  function load() {
    if (!db) return Promise.resolve();
    return db.from('visitas').select('*').order('fecha', { ascending: false }).then(function (res) {
      if (res.error) { dbState = 'off'; loadErr = errText(res.error); render(); return; }
      visitas = (res.data || []).map(fromRow); dbState = 'ready'; loadErr = null;
      var active = document.activeElement;
      if (tab === 'pauta' && active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
      render();
    });
  }
  function save() {
    if (!db || !form) return;
    var data = JSON.parse(JSON.stringify(form));
    var c = calc(data); data.pTec = c.pTec; data.pSeg = c.pSeg; data.pTot = c.pTot; data.pUbica = c.pUbica;
    var row = toRow(data);
    var btn = $('[data-act="save"]'); if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
    var p = editingId
      ? db.rpc('admin_actualizar', { p_clave: adminClave, p_id: editingId, p_data: row })
      : db.from('visitas').insert(row).select('id').single();
    p.then(function (res) {
      if (res.error) throw res.error;
      var id = editingId || (res.data && res.data.id);
      saveMsg = { c: 'okmsg', t: 'Visita guardada: ' + data.supervisor + ' · ' + fmt(data.fecha) + '.' };
      clearDraft(); form = null; editingId = null; openVisitId = id; tab = 'resultados';
      return load();
    }).then(function () { window.scrollTo(0, 0); }).catch(function (err) {
      saveMsg = { c: 'err', t: 'No se pudo guardar (' + errText(err) + '). Revise la conexión e intente de nuevo; el borrador sigue en este teléfono.' };
      render();
    });
  }
  function findV(id) { return visitas.filter(function (x) { return x.id === id; })[0]; }
  function toggleAccion(id) {
    var v = findV(id); if (!v || !db || !isOwner) return;
    db.rpc('admin_estado_accion', { p_clave: adminClave, p_id: id, p_estado: v.accionEstado === 'cerrada' ? 'abierta' : 'cerrada' }).then(function (res) { if (res.error) { saveMsg = { c: 'err', t: 'No se pudo cambiar la acción: ' + errText(res.error) }; render(); } else load(); });
  }
  function delVisita(id) {
    if (!db || !isOwner) return;
    db.rpc('admin_eliminar', { p_clave: adminClave, p_id: id }).then(function (res) { confirmDel = null; if (res.error) { saveMsg = { c: 'err', t: 'No se pudo eliminar: ' + errText(res.error) }; render(); return; } openVisitId = null; load(); });
  }
  function adminLogin(clave) {
    if (!db || !clave) return;
    db.rpc('admin_verificar', { p_clave: clave }).then(function (res) {
      if (!res.error && res.data === true) { adminClave = clave; isOwner = true; try { sessionStorage.setItem('admin-clave', clave); } catch (e) {} adminMsg = null; }
      else { adminMsg = 'Clave incorrecta.'; }
      var bd = document.getElementById('adminBadge'); if (bd) bd.classList.toggle('hidden', !isOwner);
      render();
    });
  }
  function adminLogout() { adminClave = null; isOwner = false; try { sessionStorage.removeItem('admin-clave'); } catch (e) {} var bd = document.getElementById('adminBadge'); if (bd) bd.classList.add('hidden'); render(); }

  render();
  var CFG = window.VISITAS_CONFIG || {};
  if (window.supabase && CFG.url && CFG.anonKey && CFG.url.indexOf('PEGAR') < 0) {
    db = window.supabase.createClient(CFG.url, CFG.anonKey);
    load();
    try { db.channel('visitas-cambios').on('postgres_changes', { event: '*', schema: 'public', table: 'visitas' }, function () { load(); }).subscribe(); } catch (e) {}
    setInterval(function () { if (document.visibilityState === 'visible') load(); }, 60000);
    try { var saved = sessionStorage.getItem('admin-clave'); if (saved) adminLogin(saved); } catch (e) {}
  } else { dbState = 'off'; loadErr = 'La app aún no está conectada a la base de datos.'; render(); }
})();
</script>
</body></html>
